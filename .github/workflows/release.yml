name: Publish release to PyPI

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: wampy-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]

          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match {expected_tag!r}"
              )
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Store distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wampy-prolog
    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-tutorials:
    name: Publish interactive tutorials
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Jupytext
        run: python -m pip install "jupytext>=1.17,<2"

      - name: Generate notebooks
        shell: bash
        run: |
          set -euo pipefail

          output_dir="${RUNNER_TEMP}/wampy-tutorials"
          mkdir -p "${output_dir}"
          cp tutorials/README.md "${output_dir}/README.md"

          generated=0
          for source in tutorials/*.nb.py; do
            if [[ ! -s "${source}" ]]; then
              continue
            fi

            name="$(basename "${source}" .nb.py)"
            python -m jupytext \
              --from py:percent \
              --to ipynb \
              --output "${output_dir}/${name}.ipynb" \
              "${source}"
            generated=$((generated + 1))
          done

          if [[ "${generated}" -eq 0 ]]; then
            echo "No non-empty tutorial sources were found." >&2
            exit 1
          fi

      - name: Replace generated tutorials branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan tutorial-publication
          cp -R "${RUNNER_TEMP}/wampy-tutorials/." .
          git add --all
          git commit -m "Publish tutorials for ${GITHUB_REF_NAME}"
          git push --force origin HEAD:tutorials
