[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "wampy-prolog"
version = "0.1.0"
description = "A Numba-accelerated Warren Abstract Machine implementation for Prolog."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Dominik Magiera"},
  { name = "Lukas Roehrig"},
  { name = "Frank Jaekel"}
]
keywords = [
  "cognitive science",
  "working memory",
  "simulation",
  "computational cognitive modeling"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numba",
  "numba-toolbox",
  "numpy",
]

[project.optional-dependencies]
prolog = [
  "janus-swi",
]
dev = [
  "pytest",
]

[project.urls]
Homepage = "https://github.com/cognitive-modeling/WAMpy"
Issues = "https://github.com/cognitive-modeling/WAMpy/issues"
Repository = "https://github.com/cognitive-modeling/WAMpy"

[tool.hatch.build.targets.wheel]
packages = ["src/wampy"]

[tool.pytest.ini_options]
markers = [
  "requires_numba_jit: marks tests that compile and execute Numba functions",
]
